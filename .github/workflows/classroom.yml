name: Sync Student Repos

on:
  # You edit a course file or a roster -> only the sections affected are set up, right away.
  push:
    branches: [main]
    paths:
      - "courses/**"
      - "rosters/**"
      - classroom.py
      - requirements.txt
      - .github/workflows/classroom.yml

  schedule:
    # Hourly: release assignments and lock repos whose time has just come.
    # Usually finds nothing to do and finishes in seconds.
    - cron: "17 * * * *"
    # Daily, about 6 am Pacific: full check of every section,
    # re-sends expired invitations and repairs anything missed.
    - cron: "7 13 * * *"

  # By hand, from the Actions tab.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, change nothing
        type: boolean
        default: true
      only:
        description: Limit to a course (dgl123) or section (dgl123/cvs1); blank = everything
        default: ""
      now:
        description: Pretend it's this time, e.g. 2026-12-06 09:00 (with dry run, previews a lock)
        default: ""

# Runs never overlap; a second one waits for the first to finish.
concurrency:
  group: sync-student-repos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to see which files a push changed

      - name: Work out which files changed
        if: github.event_name == 'push'
        run: |
          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > "$RUNNER_TEMP/changed.txt"
          else
            echo ALL > "$RUNNER_TEMP/changed.txt"
          fi
          cat "$RUNNER_TEMP/changed.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Sync repos with the course files and rosters
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          MODE: ${{ github.event.schedule == '17 * * * *' && 'due' || 'full' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ONLY: ${{ inputs.only }}
          NOW: ${{ inputs.now }}
          CHANGED_FILES_PATH: ${{ github.event_name == 'push' && format('{0}/changed.txt', runner.temp) || '' }}
        run: python classroom.py
