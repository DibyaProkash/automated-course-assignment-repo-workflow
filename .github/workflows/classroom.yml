name: Sync Student Repos

on:
  # 1. You edit the roster or course.yml -> new students / assignments are set up at once.
  push:
    branches: [main]
    paths: [course.yml, "*.csv", classroom.py]

  # 2. Every hour: release scheduled assignments, re-send expired invitations,
  #    and lock repos whose deadline has passed.
  schedule:
    - cron: "17 * * * *"

  # 3. By hand, from the Actions tab.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, change nothing
        type: boolean
        default: true
      only_assignment:
        description: Limit to one assignment (template name); blank = all
        default: ""
      now:
        description: Pretend it's this time, e.g. 2026-12-06 09:00 (use with dry run to preview a lock)
        default: ""

# A push and the hourly run never work on the same repos at the same time.
concurrency:
  group: sync-student-repos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Sync repos with course.yml and the roster
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          ONLY_ASSIGNMENT: ${{ inputs.only_assignment }}
          NOW: ${{ inputs.now }}
        run: python classroom.py
