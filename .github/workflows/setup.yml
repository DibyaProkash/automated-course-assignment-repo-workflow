name: Setup Student Repos

on:
  # This allows you to trigger the script manually from the GitHub UI
  workflow_dispatch: 

jobs:
  setup-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyGithub pandas

      - name: Run Setup Script
        env:
          # This passes your secret token to the Python script securely
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }} 
        run: python setup_class.py
